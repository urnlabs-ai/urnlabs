apiVersion: v1
kind: Secret
metadata:
  name: urnlabs-platform-secrets
  namespace: urnlabs-platform
  labels:
    app.kubernetes.io/name: urnlabs-ai-platform
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials
  DATABASE_URL: "postgresql://urnlabs_user:${DATABASE_PASSWORD}@postgres-service:5432/urnlabs_production"
  DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
  
  # Redis credentials
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis-service:6379"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  
  # JWT Configuration
  JWT_SECRET: "${JWT_SECRET}"
  JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
  
  # External API Keys
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"
  GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
  
  # GitHub Integration
  GITHUB_TOKEN: "${GITHUB_TOKEN}"
  GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET}"
  
  # Slack Integration
  SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
  SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL}"
  
  # Security Scanning
  SNYK_TOKEN: "${SNYK_TOKEN}"
  
  # Monitoring
  DATADOG_API_KEY: "${DATADOG_API_KEY}"
  NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY}"
  
  # Feature Flags API
  FEATURE_FLAG_API_TOKEN: "${FEATURE_FLAG_API_TOKEN}"

---
apiVersion: v1
kind: Secret
metadata:
  name: urnlabs-staging-secrets
  namespace: urnlabs-staging
  labels:
    app.kubernetes.io/name: urnlabs-ai-platform
    app.kubernetes.io/component: secrets
    app.kubernetes.io/environment: staging
type: Opaque
stringData:
  # Database credentials
  DATABASE_URL: "postgresql://urnlabs_staging_user:${STAGING_DATABASE_PASSWORD}@postgres-staging-service:5432/urnlabs_staging"
  DATABASE_PASSWORD: "${STAGING_DATABASE_PASSWORD}"
  
  # Redis credentials
  REDIS_URL: "redis://:${STAGING_REDIS_PASSWORD}@redis-staging-service:6379"
  REDIS_PASSWORD: "${STAGING_REDIS_PASSWORD}"
  
  # JWT Configuration
  JWT_SECRET: "${STAGING_JWT_SECRET}"
  JWT_REFRESH_SECRET: "${STAGING_JWT_REFRESH_SECRET}"
  
  # External API Keys (Staging)
  ANTHROPIC_API_KEY: "${STAGING_ANTHROPIC_API_KEY}"
  OPENAI_API_KEY: "${STAGING_OPENAI_API_KEY}"
  
  # GitHub Integration
  GITHUB_TOKEN: "${GITHUB_TOKEN}"
  
  # Slack Integration
  SLACK_WEBHOOK_URL: "${STAGING_SLACK_WEBHOOK}"

---
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: urnlabs-platform
  labels:
    app.kubernetes.io/name: urnlabs-ai-platform
    app.kubernetes.io/component: registry
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "${GITHUB_USERNAME}",
          "password": "${GITHUB_TOKEN}",
          "auth": "${GITHUB_REGISTRY_AUTH}"
        }
      }
    }

---
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: urnlabs-staging
  labels:
    app.kubernetes.io/name: urnlabs-ai-platform
    app.kubernetes.io/component: registry
    app.kubernetes.io/environment: staging
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "${GITHUB_USERNAME}",
          "password": "${GITHUB_TOKEN}",
          "auth": "${GITHUB_REGISTRY_AUTH}"
        }
      }
    }
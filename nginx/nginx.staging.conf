# Nginx Configuration for Urnlabs AI Platform Staging (Blue-Green Deployment)
# This configuration supports zero-downtime deployments with automatic traffic switching

worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # MIME Types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate Limiting (More relaxed for staging)
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

    # Upstream Definitions for Blue-Green Deployment
    # API Service Upstreams
    upstream api-staging-blue {
        least_conn;
        server api-staging-blue:7001 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream api-staging-green {
        least_conn;
        server api-staging-green:7001 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Agents Service Upstreams
    upstream agents-staging-blue {
        least_conn;
        server agents-staging-blue:7002 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream agents-staging-green {
        least_conn;
        server agents-staging-green:7002 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Gateway Service Upstreams
    upstream gateway-staging-blue {
        least_conn;
        server gateway-staging-blue:7000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream gateway-staging-green {
        least_conn;
        server gateway-staging-green:7000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Bridge Service Upstreams
    upstream bridge-staging-blue {
        least_conn;
        server bridge-staging-blue:7003 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream bridge-staging-green {
        least_conn;
        server bridge-staging-green:7003 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Dashboard Service Upstreams
    upstream dashboard-staging-blue {
        least_conn;
        server dashboard-staging-blue:7004 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream dashboard-staging-green {
        least_conn;
        server dashboard-staging-green:7004 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Active Service Selection (Blue by default)
    # This section will be dynamically updated by the blue-green deployment script
    upstream api-active {
        server api-staging-blue:7001;
    }

    upstream agents-active {
        server agents-staging-blue:7002;
    }

    upstream gateway-active {
        server gateway-staging-blue:7000;
    }

    upstream bridge-active {
        server bridge-staging-blue:7003;
    }

    upstream dashboard-active {
        server dashboard-staging-blue:7004;
    }

    # Main Server Block
    server {
        listen 80;
        listen [::]:80;
        server_name staging.urnlabs.ai;

        # Security Headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # Health Check Endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API Gateway Route
        location / {
            limit_req zone=general burst=100 nodelay;

            proxy_pass http://gateway-active;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
        }

        # API Direct Routes
        location /api/ {
            limit_req zone=api burst=40 nodelay;

            proxy_pass http://api-active;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
        }

        # Agents Routes
        location /agents/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://agents-active;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Extended timeouts for AI processing
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
        }

        # Bridge Routes
        location /bridge/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://bridge-active;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
        }

        # Dashboard Routes
        location /dashboard/ {
            limit_req zone=general burst=60 nodelay;

            proxy_pass http://dashboard-active;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
        }

        # WebSocket Support for Real-time Features
        location /ws/ {
            proxy_pass http://gateway-active;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket specific timeouts
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # Health Check Routes (Bypass rate limiting)
        location /health {
            access_log off;
            proxy_pass http://gateway-active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Monitoring and Metrics
        location /metrics {
            proxy_pass http://api-active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom Error Pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # Status Server for Monitoring
    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;

        access_log off;

        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
# Security Compliance Configuration
# This file defines security policies and compliance rules for the Urnlabs AI Platform

compliance:
  version: "1.0.0"
  last_updated: "2024-01-15"

  # Security Policy Configuration
  security_policies:

    # Authentication Requirements
    authentication:
      password_policy:
        min_length: 12
        require_uppercase: true
        require_lowercase: true
        require_numbers: true
        require_special_chars: true
        max_age_days: 90
        history_count: 12
        lockout_attempts: 5
        lockout_duration_minutes: 30

      session_management:
        max_age_minutes: 480  # 8 hours
        idle_timeout_minutes: 60
        concurrent_sessions: 3
        secure_cookies: true
        httponly_cookies: true
        samesite: "strict"

      multi_factor_auth:
        required_for_admin: true
        required_for_production: true
        backup_codes_count: 10
        totp_window: 30

    # Network Security
    network_security:
      tls_version: "1.3"
      cipher_suites:
        - "TLS_AES_256_GCM_SHA384"
        - "TLS_CHACHA20_POLY1305_SHA256"
        - "TLS_AES_128_GCM_SHA256"

      security_headers:
        x_frame_options: "DENY"
        x_content_type_options: "nosniff"
        x_xss_protection: "1; mode=block"
        strict_transport_security: "max-age=31536000; includeSubDomains; preload"
        content_security_policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
        referrer_policy: "strict-origin-when-cross-origin"

      rate_limiting:
        global_requests_per_minute: 1000
        per_ip_requests_per_minute: 100
        authentication_attempts_per_minute: 5
        burst_limit: 50

    # Data Protection
    data_protection:
      encryption:
        data_at_rest: "AES-256-GCM"
        data_in_transit: "TLS 1.3"
        key_rotation_days: 90
        key_escrow: true

      pii_handling:
        anonymization_required: true
        pseudonymization_method: "HMAC-SHA256"
        retention_period_days: 2555  # 7 years
        deletion_verification: true

      backup_security:
        encryption_required: true
        offsite_storage: true
        verification_frequency_days: 30
        retention_period_years: 7

    # Access Control
    access_control:
      rbac_enabled: true
      principle_of_least_privilege: true
      regular_access_review_days: 90
      privileged_account_monitoring: true

      admin_controls:
        approval_required_for_privilege_escalation: true
        admin_session_recording: true
        admin_action_logging: true
        break_glass_procedures: true

    # Audit and Monitoring
    audit_monitoring:
      log_retention_years: 7
      real_time_monitoring: true
      anomaly_detection: true
      incident_response_time_hours: 4

      events_to_log:
        - authentication_attempts
        - privilege_escalation
        - data_access
        - configuration_changes
        - security_policy_violations
        - admin_actions
        - failed_api_calls
        - data_exports

  # Privacy Compliance (GDPR, CCPA, etc.)
  privacy_compliance:

    gdpr:
      enabled: true
      data_protection_officer_contact: "dpo@urnlabs.com"
      lawful_basis: "legitimate_interest"
      consent_management: true
      data_portability: true
      right_to_be_forgotten: true
      privacy_by_design: true

      breach_notification:
        authority_notification_hours: 72
        individual_notification_required: true
        high_risk_threshold: "likely_to_result_in_risk"

      data_processing:
        purpose_limitation: true
        data_minimization: true
        accuracy_maintenance: true
        storage_limitation: true
        integrity_confidentiality: true

    ccpa:
      enabled: true
      privacy_policy_link: "/privacy-policy"
      do_not_sell_link: "/do-not-sell"
      consumer_request_portal: "/privacy-requests"
      verification_required: true

      consumer_rights:
        right_to_know: true
        right_to_delete: true
        right_to_opt_out: true
        right_to_non_discrimination: true

    hipaa:
      enabled: false  # Enable if processing health data
      business_associate_agreement: false
      minimum_necessary_standard: true
      safeguards_required: true

  # Regulatory Compliance
  regulatory_compliance:

    soc2_type_ii:
      enabled: true
      trust_services_criteria:
        security: true
        availability: true
        processing_integrity: true
        confidentiality: true
        privacy: true

      controls:
        access_controls: true
        logical_physical_access: true
        system_operations: true
        change_management: true
        risk_mitigation: true

    iso27001:
      enabled: true
      isms_scope: "entire_organization"
      risk_assessment_frequency_months: 12
      management_review_frequency_months: 12

      control_domains:
        information_security_policies: true
        organization_information_security: true
        human_resource_security: true
        asset_management: true
        access_control: true
        cryptography: true
        physical_environmental_security: true
        operations_security: true
        communications_security: true
        system_acquisition_development_maintenance: true
        supplier_relationships: true
        information_security_incident_management: true
        information_security_business_continuity: true
        compliance: true

    pci_dss:
      enabled: false  # Enable if processing payment card data
      level: "1"  # 1-4 based on transaction volume
      quarterly_scans: true
      annual_assessment: true

  # License Compliance
  license_compliance:

    allowed_licenses:
      - "MIT"
      - "Apache-2.0"
      - "BSD-2-Clause"
      - "BSD-3-Clause"
      - "ISC"
      - "0BSD"
      - "CC0-1.0"
      - "Unlicense"
      - "WTFPL"

    prohibited_licenses:
      - "GPL-2.0"
      - "GPL-3.0"
      - "LGPL-2.1"
      - "LGPL-3.0"
      - "AGPL-3.0"
      - "SSPL-1.0"
      - "BSL-1.0"
      - "BUSL-1.1"

    license_scanning:
      frequency: "daily"
      fail_on_prohibited: true
      report_generation: true
      legal_review_required: true

  # Incident Response
  incident_response:

    severity_levels:
      critical:
        description: "System compromise or data breach"
        response_time_minutes: 15
        escalation_required: true
        external_notification: true

      high:
        description: "Service disruption or security vulnerability"
        response_time_minutes: 60
        escalation_required: true
        external_notification: false

      medium:
        description: "Performance degradation or minor security issue"
        response_time_minutes: 240
        escalation_required: false
        external_notification: false

      low:
        description: "Minor issues with workarounds available"
        response_time_minutes: 1440  # 24 hours
        escalation_required: false
        external_notification: false

    response_team:
      primary_contact: "security-team@urnlabs.com"
      escalation_contacts:
        - "ciso@urnlabs.com"
        - "cto@urnlabs.com"
        - "legal@urnlabs.com"

      external_contacts:
        law_enforcement: "FBI IC3"
        regulatory_bodies:
          - "Data Protection Authority"
          - "SEC (if public company)"
        customers: "customer-success@urnlabs.com"

  # Business Continuity
  business_continuity:

    disaster_recovery:
      rto_hours: 4  # Recovery Time Objective
      rpo_hours: 1  # Recovery Point Objective
      backup_frequency_hours: 6
      backup_retention_years: 7
      offsite_backup_required: true

    high_availability:
      uptime_target: 99.9
      redundancy_required: true
      failover_testing_frequency_months: 6
      load_balancing: true

    crisis_communication:
      internal_notification_minutes: 30
      customer_notification_hours: 4
      public_disclosure_timeline: "as_required_by_law"

# Security Scanning Configuration
security_scanning:

  static_analysis:
    tools:
      - name: "CodeQL"
        enabled: true
        languages: ["javascript", "typescript"]
        security_queries: true
        quality_queries: false

      - name: "Snyk Code"
        enabled: true
        severity_threshold: "medium"
        fail_on_issues: true

      - name: "ESLint Security"
        enabled: true
        rules: "eslint-plugin-security"

  dependency_scanning:
    tools:
      - name: "Snyk"
        enabled: true
        severity_threshold: "high"
        auto_fix: true
        license_scanning: true

      - name: "OWASP Dependency Check"
        enabled: true
        cvss_threshold: 7.0
        retired_dependencies: true

      - name: "Trivy"
        enabled: true
        scan_types: ["vuln", "secret", "config"]
        severity: ["CRITICAL", "HIGH", "MEDIUM"]

  dynamic_analysis:
    tools:
      - name: "OWASP ZAP"
        enabled: true
        scan_type: "baseline"
        fail_on_warn: false

      - name: "Nuclei"
        enabled: true
        templates: "cves,vulnerabilities"
        rate_limit: 150

  secret_scanning:
    tools:
      - name: "GitLeaks"
        enabled: true
        fail_on_secrets: true
        entropy_scanning: true

      - name: "TruffleHog"
        enabled: true
        entropy_threshold: 3.5
        scan_history: false

  container_scanning:
    tools:
      - name: "Trivy"
        enabled: true
        scan_layers: true
        distro_scanning: true

      - name: "Clair"
        enabled: false
        vulnerability_threshold: "medium"

# Compliance Validation Rules
validation_rules:

  pre_deployment:
    - security_scan_passed
    - license_compliance_check
    - privacy_impact_assessment
    - change_approval_obtained

  post_deployment:
    - health_check_passed
    - security_baseline_verified
    - monitoring_alerts_configured
    - incident_response_tested

  continuous:
    - vulnerability_scanning_daily
    - compliance_monitoring_realtime
    - access_review_quarterly
    - policy_review_annually